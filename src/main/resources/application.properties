spring.application.name=ticket-management-system
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket-management
spring.datasource.username=postgres
spring.datasource.password=2002
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
jwt.secret=ThisIsMyVerySecretKeyForJwtAuthentication1234567890
jwt.expiration=3600000
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always